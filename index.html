<!DOCTYPE html>
<html lang="ja">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>タイムカード</title>
<script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.12/dist/face-api.js"></script>
<style>
  :root {
    --bg: #0f172a; --panel: #1e293b; --line: #334155; --text: #f1f5f9; --sub: #94a3b8;
    --in: #16a34a; --out: #ea580c; --ok: #22c55e; --ng: #ef4444; --accent: #3b82f6;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: -apple-system, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    -webkit-user-select: none; user-select: none; }
  input { -webkit-user-select: text; user-select: text; }
  .app { display: flex; flex-wrap: wrap; gap: 16px; padding: 16px; min-height: 100%; }
  .left { flex: 1 1 420px; display: flex; flex-direction: column; gap: 12px; }
  .right { flex: 1 1 320px; display: flex; flex-direction: column; gap: 12px; }
  header { display: flex; align-items: baseline; justify-content: space-between; }
  #clock { font-size: 56px; font-weight: 700; letter-spacing: 2px; font-variant-numeric: tabular-nums; }
  #date { font-size: 20px; color: var(--sub); }
  .gear { background: none; border: 1px solid var(--line); color: var(--sub); border-radius: 10px;
    padding: 8px 14px; font-size: 16px; }
  .cam { position: relative; background: #000; border-radius: 16px; overflow: hidden; aspect-ratio: 4 / 3; }
  .cam video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); display: block; }
  .cam .frame { position: absolute; inset: 12% 22%; border: 3px dashed rgba(255,255,255,.35); border-radius: 50%; pointer-events: none; }
  #who { text-align: center; font-size: 30px; font-weight: 700; padding: 14px; border-radius: 14px;
    background: var(--panel); min-height: 74px; }
  #who.ok { background: #14532d; }
  .btns { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .btns button { font-size: 36px; font-weight: 800; color: #fff; border: none; border-radius: 18px; padding: 34px 0; }
  .btns button:disabled { opacity: .3; }
  #btnIn { background: var(--in); } #btnOut { background: var(--out); }
  .card { background: var(--panel); border-radius: 14px; padding: 14px; }
  .card h3 { margin: 0 0 10px; font-size: 16px; color: var(--sub); font-weight: 600; }
  .status { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { padding: 8px 12px; border-radius: 999px; background: var(--line); font-size: 16px; }
  .chip.in { background: var(--in); } .chip.out { background: #475569; color: #cbd5e1; }
  #log { list-style: none; margin: 0; padding: 0; max-height: 260px; overflow-y: auto; font-size: 18px; }
  #log li { display: flex; gap: 14px; padding: 6px 2px; border-bottom: 1px solid var(--line); }
  #log .t { font-variant-numeric: tabular-nums; color: var(--sub); }
  .tag { padding: 0 8px; border-radius: 6px; font-size: 15px; }
  .tag.出勤 { background: var(--in); } .tag.退勤 { background: var(--out); }
  .empty { color: var(--sub); font-size: 15px; }

  /* 結果表示 */
  #toast { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(0,0,0,.6); z-index: 20; }
  #toast .box { background: #fff; color: #111; border-radius: 24px; padding: 40px 60px; text-align: center; min-width: 60%; }
  #toast .big { font-size: 44px; font-weight: 800; }
  #toast .small { font-size: 24px; margin-top: 10px; color: #444; }
  #toast.ng .big { color: var(--ng); }
  /* 押し忘れの警告 */
  #toast.missed .box { border: 6px solid var(--ng); }
  #toastWarn { display: none; margin-top: 24px; padding: 18px 28px; border-radius: 16px; background: var(--ng); color: #fff;
    font-size: 40px; font-weight: 800; line-height: 1.5; word-break: keep-all; }
  #toast.missed #toastWarn { display: block; }
  #toastWhen { font-size: 32px; padding-bottom: 10px; margin-bottom: 10px; border-bottom: 2px solid rgba(255,255,255,.6); }

  /* 読み込み中 */
  #loading { position: fixed; inset: 0; background: var(--bg); display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 16px; z-index: 30; font-size: 22px; }
  #loading .sub { font-size: 15px; color: var(--sub); max-width: 80%; text-align: center; }

  /* 管理画面 */
  #admin { position: fixed; inset: 0; background: rgba(0,0,0,.7); display: none; align-items: center; justify-content: center; z-index: 25; }
  #admin .box { background: var(--panel); border-radius: 20px; padding: 24px; width: min(680px, 94vw); max-height: 90vh; overflow-y: auto; }
  #admin h2 { margin: 0 0 16px; }
  #admin input { width: 100%; font-size: 22px; padding: 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--text); }
  #admin .row { display: flex; gap: 10px; margin-top: 12px; }
  #admin button { font-size: 18px; padding: 12px 18px; border-radius: 10px; border: none; color: #fff; background: var(--accent); }
  #admin button.gray { background: #475569; } #admin button.red { background: var(--ng); }
  #admin .emp { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 20px; }
  #admin .emp small { color: var(--sub); font-size: 14px; margin-left: 8px; }
  #regMsg { margin-top: 12px; font-size: 18px; min-height: 26px; color: #fde68a; }
  .progress { height: 10px; background: var(--line); border-radius: 5px; overflow: hidden; margin-top: 10px; }
  .progress div { height: 100%; width: 0; background: var(--ok); transition: width .2s; }
  #admin select, #admin .rec input, #admin .addrow input, #admin input.date { width: auto; font-size: 18px; padding: 8px 10px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--bg); color: var(--text); }
  #admin .rec, #admin .addrow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--line); }
  #admin .rec .nm { flex: 1 1 90px; font-size: 18px; }
  #admin .rec small { flex-basis: 100%; color: var(--sub); font-size: 13px; }
  #admin .rec button, #admin .addrow button { padding: 8px 14px; font-size: 16px; }
  #recMsg { margin-top: 8px; font-size: 16px; min-height: 22px; color: #fde68a; }
</style>
</head>
<body>
<div id="loading"><div id="loadingText">準備しています…</div><div class="sub" id="loadingSub">初回は顔認識の部品を読み込むので少し時間がかかります</div></div>

<div class="app">
  <div class="left">
    <header>
      <div><div id="clock">--:--</div><div id="date"></div></div>
      <button class="gear" onclick="openAdmin()">⚙ 管理</button>
    </header>
    <div class="cam"><video id="video" autoplay muted playsinline></video><div class="frame"></div></div>
  </div>
  <div class="right">
    <div id="who">カメラに顔を向けてください</div>
    <div class="btns">
      <button id="btnIn" onclick="doPunch('出勤')" disabled>しゅっきん</button>
      <button id="btnOut" onclick="doPunch('退勤')" disabled>たいきん</button>
    </div>
    <div class="card"><h3>今日の状況</h3><div class="status" id="status"></div></div>
    <div class="card"><h3>今日の打刻</h3><ul id="log"></ul></div>
  </div>
</div>

<div id="toast"><div class="box"><div class="big" id="toastBig"></div><div class="small" id="toastSmall"></div>
  <div id="toastWarn"><div id="toastWhen"></div>おぐらさんに<wbr>おしわすれたと<wbr>つたえてください</div></div></div>

<div id="admin"><div class="box">
  <div id="pinArea">
    <h2>管理用の番号</h2>
    <input id="pin" type="password" inputmode="numeric" placeholder="番号を入力">
    <div class="row"><button onclick="submitPin()">開く</button><button class="gray" onclick="closeAdmin()">閉じる</button></div>
  </div>
  <div id="manageArea" style="display:none">
    <h2>顔の登録</h2>
    <input id="regName" placeholder="名前（例：小倉）">
    <div class="row"><button id="regBtn" onclick="startRegister()">顔を撮影して登録</button><button class="gray" onclick="closeAdmin()">閉じる</button></div>
    <div class="progress"><div id="regBar"></div></div>
    <div id="regMsg">カメラの正面で、少しずつ顔の向きを変えてください（5回撮影）</div>
    <h2 style="margin-top:24px">登録済み</h2>
    <div id="empList"></div>
    <h2 style="margin-top:24px">打刻の修正</h2>
    <div class="row" style="align-items:center"><input type="date" id="recDate" class="date" onchange="loadRecords()"><button class="gray" onclick="loadRecords()">読み込み直す</button></div>
    <div id="recList"></div>
    <div class="addrow"><b style="font-size:16px">足す：</b><select id="addEmp"></select>
      <select id="addType"><option>出勤</option><option>退勤</option></select>
      <input type="time" id="addTime"><button onclick="addRecord()">追加</button></div>
    <div id="recMsg"></div>
  </div>
</div></div>

<script>
const MODEL_URL = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.12/model/';
const THRESHOLD = 0.45;      // これより距離が小さければ本人とみなす（小さくするほど厳しい）
const SHOTS = 5;             // 登録時の撮影回数
const KANA = { '出勤': 'しゅっきん', '退勤': 'たいきん' };  // 画面の表示用（記録は漢字のまま）

let employees = [];          // {id, name, descriptors: [Float32Array]}
let today = [];
let current = null;          // 今カメラに映っている（確定した）社員
let candidate = null, candidateCount = 0, missCount = 0;
let paused = false, adminPin = null;
const video = document.getElementById('video');
const $ = id => document.getElementById(id);

// ---------- サーバー呼び出し（Apps Script の記録用の入口へ。localhost ではダミー） ----------
const API_URL = 'https://script.google.com/macros/s/AKfycbylhBqvc1wVFc9bh1agH-86LBQS3AvFRVd10iItqp7jprPivE3MfLHIw9sAAMM2ueQ35Q/exec';
const USE_MOCK = location.hostname === 'localhost' || location.protocol === 'file:';
const KEY_STORE = 'timecard_key';

function getKey() { try { return localStorage.getItem(KEY_STORE) || ''; } catch (e) { return ''; } }
function setKey(k) { try { k ? localStorage.setItem(KEY_STORE, k) : localStorage.removeItem(KEY_STORE); } catch (e) {} }

async function server(fn, ...args) {
  if (USE_MOCK) return mock[fn](...args);
  const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ key: getKey(), fn, args }) });
  const data = await res.json();
  if (!data.ok) {
    if (data.error === '合言葉が違います') setKey('');
    throw new Error(data.error);
  }
  return data.result;
}

// 合言葉（最初に1回だけ入れる。iPadに記憶される）
function askKey(message) {
  return new Promise(resolve => {
    $('loadingText').textContent = message || '合言葉を入れてください（最初の1回だけ）';
    $('loadingSub').innerHTML = '<input id="keyInput" style="font-size:22px;padding:12px;border-radius:10px;width:min(420px,80vw)" autocapitalize="off" autocorrect="off">'
      + '<div style="margin-top:12px"><button id="keyBtn" style="font-size:20px;padding:12px 28px;border-radius:10px;border:none;background:#3b82f6;color:#fff">決定</button></div>';
    $('keyBtn').onclick = () => {
      const k = $('keyInput').value.trim();
      if (!k) return;
      setKey(k);
      $('loadingSub').textContent = '';
      resolve();
    };
  });
}
const mock = (() => {
  const load = k => JSON.parse(localStorage.getItem('tc_' + k) || '[]');
  const save = (k, v) => localStorage.setItem('tc_' + k, JSON.stringify(v));
  const hm = d => d.toTimeString().slice(0, 5);
  const ymd = ts => { const d = new Date(ts); return d.getFullYear() + '/' + String(d.getMonth() + 1).padStart(2, '0') + '/' + String(d.getDate()).padStart(2, '0'); };
  const todayRecs = () => load('log').filter(r => new Date(r.ts).toDateString() === new Date().toDateString());
  return {
    getInitData: () => ({ employees: load('emp'), today: todayRecs() }),
    checkPin: pin => pin !== '',   // 手元確認用のダミー（本物の番号はApps Scriptだけが持つ）
    getRecords(pin, date) {
      return load('log').map((r, i) => ({ ...r, row: i + 2 })).filter(r => ymd(r.ts) === date).sort((a, b) => a.ts - b.ts);
    },
    saveRecord(pin, rec) {
      const l = load('log'); const emp = load('emp').find(x => x.id === rec.id);
      const e = { id: rec.id, name: emp.name, type: rec.type, time: rec.time, ts: new Date(rec.date.replace(/\//g, '-') + 'T' + rec.time).getTime(), note: rec.row ? '修正' : '手入力' };
      if (rec.row) l[rec.row - 2] = e; else l.push(e);
      save('log', l); return { records: this.getRecords(pin, rec.date), today: todayRecs() };
    },
    deleteRecord(pin, row, ts, date) {
      const l = load('log'); l.splice(row - 2, 1); save('log', l);
      return { records: this.getRecords(pin, date), today: todayRecs() };
    },
    registerEmployee(pin, name, desc) {
      const e = load('emp'); const f = e.find(x => x.name === name);
      if (f) f.descriptors = desc; else e.push({ id: String(e.length + 1), name, descriptors: desc });
      save('emp', e); return e;
    },
    deleteEmployee(pin, id) { const e = load('emp').filter(x => x.id !== id); save('emp', e); return e; },
    punch(id, type) {
      const emp = load('emp').find(x => x.id === id); const now = new Date();
      const done = todayRecs().find(r => r.id === id && r.type === type);
      if (done) return { ok: false, msg: emp.name + 'さんは きょう ' + done.time + ' に' + type + '済みです', today: todayRecs() };
      // 押し忘れ（本物は Apps Script の findMissed_ が判定してメールも送る）
      const start = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
      const mine = load('log').filter(r => r.id === id).sort((a, b) => a.ts - b.ts);
      const todays = mine.filter(r => r.ts >= start), prev = mine.filter(r => r.ts < start).pop();
      const missed = [];
      if (!todays.length && prev && prev.type === '出勤') missed.push({ date: ymd(prev.ts), type: '退勤' });
      if (type === '退勤' && !todays.some(r => r.type === '出勤')) missed.push({ date: ymd(now), type: '出勤' });
      if (type === '出勤' && todays.some(r => r.type === '退勤')) missed.push({ date: ymd(now), type: '順番' });
      const l = load('log'); l.push({ id, name: emp.name, type, time: hm(now), ts: now.getTime() }); save('log', l);
      return { ok: true, name: emp.name, type, time: hm(now), today: todayRecs(), missed };
    }
  };
})();

// ---------- 起動 ----------
async function init() {
  setInterval(tick, 1000); tick();
  try {
    $('loadingText').textContent = 'カメラを起動しています…';
    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } }, audio: false });
    video.srcObject = stream;
    await video.play();
  } catch (e) {
    return fatal('カメラを起動できませんでした', 'iPadの「設定 → Safari → カメラ」を「許可」にして、ページを開き直してください。（' + (e.message || e) + '）');
  }
  try {
    $('loadingText').textContent = '顔認識の準備をしています…';
    await Promise.all([
      faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL),
      faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL),
      faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL)
    ]);
  } catch (e) {
    return fatal('顔認識の部品を読み込めませんでした', 'インターネット接続を確認して、ページを開き直してください。（' + (e.message || e) + '）');
  }
  if (!USE_MOCK && !getKey()) await askKey();
  for (;;) {
    try {
      $('loadingText').textContent = 'データを読み込んでいます…';
      const d = await server('getInitData');
      setEmployees(d.employees); setToday(d.today);
      break;
    } catch (e) {
      if (!getKey() && !USE_MOCK) { await askKey('合言葉が違います。もう一度入れてください'); continue; }
      return fatal('データを読み込めませんでした', String(e.message || e));
    }
  }
  $('loading').style.display = 'none';
  if (!employees.length) setWho('まず「⚙ 管理」から顔を登録してください', false);
  loop();
}

function fatal(title, sub) {
  $('loadingText').textContent = title;
  $('loadingSub').textContent = sub;
}

let lastDay = new Date().toDateString();
function tick() {
  const d = new Date();
  if (d.toDateString() !== lastDay) {   // 日付が変わったら今日の打刻を読み直す
    lastDay = d.toDateString();
    renderStatus(); renderLog();
    if ($('loading').style.display === 'none') server('getInitData').then(r => setToday(r.today)).catch(() => {});
  }
  $('clock').textContent = d.toTimeString().slice(0, 8);
  $('date').textContent = `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日（${'日月火水木金土'[d.getDay()]}）`;
}

// ---------- 顔の判定 ----------
async function detect() {
  return faceapi.detectSingleFace(video, new faceapi.TinyFaceDetectorOptions({ inputSize: 320, scoreThreshold: 0.5 }))
    .withFaceLandmarks().withFaceDescriptor();
}

function bestMatch(desc) {
  let best = null;
  for (const e of employees) {
    for (const d of e.descriptors) {
      const dist = faceapi.euclideanDistance(desc, d);
      if (!best || dist < best.dist) best = { emp: e, dist };
    }
  }
  return best;
}

async function loop() {
  try {
    if (!paused && video.readyState >= 2 && employees.length) {
      const r = await detect();
      if (!r) {
        if (++missCount >= 2) { current = null; candidate = null; setWho('カメラに顔を向けてください', false); }
      } else {
        missCount = 0;
        const m = bestMatch(r.descriptor);
        if (m && m.dist < THRESHOLD) {
          if (candidate && candidate.emp.id === m.emp.id) candidateCount++; else { candidate = m; candidateCount = 1; }
          candidate.dist = m.dist;
          if (candidateCount >= 2) { current = candidate; setWho(current.emp.name + ' さん', true); }
        } else {
          current = null; candidate = null;
          setWho('登録されていない顔です', false);
        }
      }
    }
  } catch (e) { console.error(e); }
  setTimeout(loop, 300);
}

function setWho(text, ok) {
  $('who').textContent = text;
  $('who').className = ok ? 'ok' : '';
  // 今日もう押した区分のボタンは押せなくする（同じ日に出勤・退勤は1回ずつ）
  const done = ok && current ? todayList().filter(r => r.id === current.emp.id).map(r => r.type) : [];
  $('btnIn').disabled = !ok || done.includes('出勤');
  $('btnOut').disabled = !ok || done.includes('退勤');
}

// 今日の分だけ（iPadを開いたまま日付が変わっても、前の日の打刻を数えない）
function todayList() {
  const d = new Date().toDateString();
  return today.filter(r => !r.ts || new Date(r.ts).toDateString() === d);
}

// ---------- 打刻 ----------
async function doPunch(type) {
  if (!current) return;
  const target = current;
  paused = true;
  $('btnIn').disabled = $('btnOut').disabled = true;
  const done = todayList().find(r => r.id === target.emp.id && r.type === type);
  if (done) return showToast('きろく していません', `${target.emp.name}さんは きょう ${done.time} に ${KANA[type]} しています`, false);
  try {
    const res = await server('punch', target.emp.id, type, target.dist);
    if (res.today) setToday(res.today);
    if (res.ok) showToast(`${res.name} さん`, `${res.time}　${KANA[res.type]} しました`, true, res.missed);
    else showToast('きろく していません', res.msg.replace(/出勤|退勤/g, t => KANA[t]), false);
  } catch (e) {
    showToast('エラー', String(e.message || e), false);
  }
}

// missed：押し忘れ [{ date, type }]（記録はした）。いつ・どちらを添えて、赤い警告を長めに出す
function showToast(big, small, ok, missed) {
  const warn = !!(missed && missed.length);
  $('toastBig').textContent = big; $('toastSmall').textContent = small;
  $('toastWhen').innerHTML = '';
  if (warn) for (const m of missed) $('toastWhen').appendChild(document.createElement('div')).textContent = missedLabel(m);
  $('toast').className = warn ? 'missed' : ok ? '' : 'ng';
  $('toast').style.display = 'flex';
  setTimeout(() => {
    $('toast').style.display = 'none';
    current = null; candidate = null;
    setWho('カメラに顔を向けてください', false);
    paused = false;
  }, warn ? 8000 : ok ? 2500 : 3500);
}

// 押し忘れの「いつ・どちら」をひらがなで（例：きのう（11がつ11にち）の たいきん）
function missedLabel(m) {
  const [y, mo, d] = m.date.split('/').map(Number);
  const days = Math.round((new Date().setHours(0, 0, 0, 0) - new Date(y, mo - 1, d)) / 864e5);
  const date = `${mo}がつ${d}にち`;
  const when = days === 0 ? `きょう（${date}）` : days === 1 ? `きのう（${date}）` : date;
  return `${when}の ${m.type === '順番' ? 'しゅっきん・たいきん' : KANA[m.type]}`;
}

// ---------- 表示 ----------
function setEmployees(list) {
  employees = list.map(e => ({ ...e, descriptors: e.descriptors.map(d => new Float32Array(d)) }));
  renderStatus(); renderEmpList(); renderRecords();
}

function setToday(list) { today = list; renderStatus(); renderLog(); }

function renderStatus() {
  const box = $('status'); box.innerHTML = '';
  if (!employees.length) { box.innerHTML = '<span class="empty">登録された人はいません</span>'; return; }
  for (const e of employees) {
    const last = todayList().filter(r => r.id === e.id).pop();
    const chip = document.createElement('span');
    chip.className = 'chip ' + (last ? (last.type === '出勤' ? 'in' : 'out') : '');
    chip.textContent = e.name + '：' + (last ? (last.type === '出勤' ? 'しゅっきん ' + last.time + '〜' : 'たいきん ' + last.time) : 'まだ');
    box.appendChild(chip);
  }
}

function renderLog() {
  const ul = $('log'); ul.innerHTML = '';
  const list = todayList();
  if (!list.length) { ul.innerHTML = '<li class="empty">まだ打刻はありません</li>'; return; }
  for (const r of [...list].reverse()) {
    const li = document.createElement('li');
    li.innerHTML = `<span class="t">${r.time}</span><span class="tag ${r.type}">${KANA[r.type] || r.type}</span><span></span>`;
    li.lastChild.textContent = r.name;
    ul.appendChild(li);
  }
}

// ---------- 管理（顔の登録） ----------
function openAdmin() {
  paused = true;
  $('admin').style.display = 'flex';
  $('pinArea').style.display = adminPin ? 'none' : 'block';
  $('manageArea').style.display = adminPin ? 'block' : 'none';
  $('pin').value = '';
}

function closeAdmin() {
  $('admin').style.display = 'none';
  adminPin = null;
  current = null; candidate = null;
  setWho(employees.length ? 'カメラに顔を向けてください' : 'まず「⚙ 管理」から顔を登録してください', false);
  paused = false;
}

async function submitPin() {
  const pin = $('pin').value;
  if (await server('checkPin', pin)) {
    adminPin = pin;
    $('pinArea').style.display = 'none'; $('manageArea').style.display = 'block';
    renderEmpList();
    if (!$('recDate').value) $('recDate').value = localYmd(new Date(), '-');
    loadRecords();
  } else alert('番号が違います');
}

function renderEmpList() {
  const box = $('empList'); if (!box) return;
  box.innerHTML = employees.length ? '' : '<div class="empty">まだいません</div>';
  for (const e of employees) {
    const div = document.createElement('div'); div.className = 'emp';
    div.innerHTML = `<span><span class="n"></span><small>顔データ ${e.descriptors.length}件</small></span><button class="red">削除</button>`;
    div.querySelector('.n').textContent = e.name;
    div.querySelector('button').onclick = async () => {
      if (!confirm(e.name + ' さんを削除しますか？（打刻の記録は残ります）')) return;
      setEmployees(await server('deleteEmployee', adminPin, e.id));
    };
    box.appendChild(div);
  }
}

// ---------- 管理（打刻の修正・追加・削除） ----------
let records = [];

function localYmd(d, sep) {
  return d.getFullYear() + sep + String(d.getMonth() + 1).padStart(2, '0') + sep + String(d.getDate()).padStart(2, '0');
}
const recDay = () => $('recDate').value.replace(/-/g, '/');   // シートの形 yyyy/MM/dd

async function loadRecords() {
  if (!$('recDate').value) return;
  $('recMsg').textContent = '読み込んでいます…';
  try {
    records = await server('getRecords', adminPin, recDay());
    renderRecords();
    $('recMsg').textContent = records.length ? '' : 'この日の打刻はありません';
  } catch (e) { $('recMsg').textContent = 'エラー：' + (e.message || e); }
}

function typeSelect(value) {
  const s = document.createElement('select');
  for (const t of ['出勤', '退勤']) {
    const o = document.createElement('option'); o.value = o.textContent = t;
    if (t === value) o.selected = true;
    s.appendChild(o);
  }
  return s;
}

function renderRecords() {
  const box = $('recList'); box.innerHTML = '';
  for (const r of records) {
    const div = document.createElement('div'); div.className = 'rec';
    const nm = document.createElement('span'); nm.className = 'nm'; nm.textContent = r.name;
    const sel = typeSelect(r.type);
    const time = document.createElement('input'); time.type = 'time'; time.value = r.time.padStart(5, '0');
    const save = document.createElement('button'); save.textContent = '保存';
    const del = document.createElement('button'); del.className = 'red'; del.textContent = '削除';
    save.onclick = () => recAction('saveRecord', { row: r.row, ts: r.ts, date: recDay(), time: time.value, id: r.id, type: sel.value });
    del.onclick = () => {
      if (confirm(`${r.name} さんの ${r.time} ${r.type} を消しますか？`)) recAction('deleteRecord', r.row, r.ts, recDay());
    };
    div.append(nm, sel, time, save, del);
    if (r.note) { const n = document.createElement('small'); n.textContent = r.note; div.appendChild(n); }
    box.appendChild(div);
  }
  const addEmp = $('addEmp'); const keep = addEmp.value; addEmp.innerHTML = '';
  for (const e of employees) { const o = document.createElement('option'); o.value = e.id; o.textContent = e.name; addEmp.appendChild(o); }
  if (keep) addEmp.value = keep;
}

async function recAction(fn, ...args) {
  if (fn === 'saveRecord') {   // 同じ人・同じ日に出勤・退勤は1回ずつ
    const rec = args[0];
    const dup = records.find(r => r.id === rec.id && r.type === rec.type && r.row !== rec.row);
    if (dup) { $('recMsg').textContent = `${dup.name} さんのこの日の${rec.type}は ${dup.time} で入っています。そちらを直してください`; return; }
  }
  $('recMsg').textContent = '保存しています…';
  try {
    const res = await server(fn, adminPin, ...args);
    records = res.records; setToday(res.today); renderRecords();
    $('recMsg').textContent = fn === 'deleteRecord' ? '消しました' : '保存しました';
  } catch (e) { $('recMsg').textContent = 'エラー：' + (e.message || e); }
}

function addRecord() {
  if (!$('addEmp').value) { $('recMsg').textContent = '先に顔の登録をしてください'; return; }
  if (!$('addTime').value) { $('recMsg').textContent = '時刻を入れてください'; return; }
  recAction('saveRecord', { date: recDay(), time: $('addTime').value, id: $('addEmp').value, type: $('addType').value });
  $('addTime').value = '';
}

async function startRegister() {
  const name = $('regName').value.trim();
  if (!name) { $('regMsg').textContent = '名前を入れてください'; return; }
  $('regBtn').disabled = true;
  const shots = [];
  let tries = 0;
  while (shots.length < SHOTS && tries < 40) {
    tries++;
    const r = await detect();
    if (r) {
      shots.push(Array.from(r.descriptor, v => Math.round(v * 10000) / 10000));
      $('regMsg').textContent = `撮影 ${shots.length} / ${SHOTS}　少し顔の向きを変えてください`;
      $('regBar').style.width = (shots.length / SHOTS * 100) + '%';
      await new Promise(res => setTimeout(res, 700));
    } else {
      $('regMsg').textContent = '顔が見つかりません。カメラの正面に来てください';
      await new Promise(res => setTimeout(res, 300));
    }
  }
  if (shots.length < SHOTS) {
    $('regMsg').textContent = '撮影できませんでした。明るい場所でもう一度お試しください';
  } else {
    // 他の人と似すぎていないか確認
    const others = employees.filter(e => e.name !== name);
    const clash = others.find(e => e.descriptors.some(d => shots.some(s => faceapi.euclideanDistance(s, d) < THRESHOLD)));
    if (clash && !confirm(`${clash.name} さんの顔とよく似ています。本当に「${name}」として登録しますか？`)) {
      $('regMsg').textContent = '登録をやめました';
    } else {
      $('regMsg').textContent = '保存しています…';
      try {
        setEmployees(await server('registerEmployee', adminPin, name, shots));
        $('regMsg').textContent = `${name} さんを登録しました`;
        $('regName').value = '';
      } catch (e) { $('regMsg').textContent = 'エラー：' + (e.message || e); }
    }
  }
  $('regBar').style.width = '0';
  $('regBtn').disabled = false;
}

init();
</script>
